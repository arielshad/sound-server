<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-labelledby="t d">
  <title id="t">What build_kit gives you</title>
  <desc id="d">An example kit: kick, snare, clap, closed hat, open hat and an 808 in F, each with its source, licence and verdict (yes or yes-with-credit), plus three alternatives per slot. In your project, samples/kits/dark-trap holds the six sounds, strudel.json that plays in strudel.cc, kit.sfz for any SFZ sampler, gm-map.json with General MIDI drum notes, and ATTRIBUTION.md and credits.json with the credits.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#8a85a3"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .h { fill: #f0eef7; font-size: 16px; font-weight: 700; }
    .sub { fill: #a29eb6; font-size: 13px; }
    .slot { fill: #f0eef7; font-size: 14.5px; font-weight: 600; }
    .src { fill: #b3afc6; font-size: 13.5px; }
    .file { fill: #e2dff0; font-size: 13.5px; }
    .why { fill: #8a85a3; font-size: 12.5px; }
    .yes { fill: #34d399; fill-opacity: 0.16; stroke: #34d399; stroke-opacity: 0.6; }
    .credit { fill: #4cc9e6; fill-opacity: 0.14; stroke: #4cc9e6; stroke-opacity: 0.6; }
    .badge { font-size: 11.5px; }
  </style>
  <rect width="960" height="380" rx="18" fill="#13111c"/>
  <rect x="0.5" y="0.5" width="959" height="379" rx="17.5" fill="none" stroke="#2a2638"/>

  <!-- the kit -->
  <rect x="30" y="30" width="470" height="320" rx="14" fill="#1d1a2b" stroke="#36314c"/>
  <text class="h" x="50" y="60">dark trap · F minor · 140 BPM</text>
  <text class="sub" x="50" y="80">one pick per slot, 3 alternatives each (example)</text>
  <path d="M50 96H480" stroke="#2f2a42"/>

  <g>
    <text class="slot" x="50" y="126">kick</text>
    <text class="src" x="150" y="126">Freesound · CC0</text>
    <rect class="yes" x="384" y="110" width="96" height="22" rx="11"/><text class="badge mono" x="432" y="125" text-anchor="middle" fill="#a7f3d0">yes</text>

    <text class="slot" x="50" y="166">snare</text>
    <text class="src" x="150" y="166">Freesound · CC BY 4.0</text>
    <rect class="credit" x="354" y="150" width="126" height="22" rx="11"/><text class="badge mono" x="417" y="165" text-anchor="middle" fill="#9be6f5">yes-with-credit</text>

    <text class="slot" x="50" y="206">clap</text>
    <text class="src" x="150" y="206">Wikimedia Commons · CC0</text>
    <rect class="yes" x="384" y="190" width="96" height="22" rx="11"/><text class="badge mono" x="432" y="205" text-anchor="middle" fill="#a7f3d0">yes</text>

    <text class="slot" x="50" y="246">hat, closed</text>
    <text class="src" x="150" y="246">Freesound · CC0</text>
    <rect class="yes" x="384" y="230" width="96" height="22" rx="11"/><text class="badge mono" x="432" y="245" text-anchor="middle" fill="#a7f3d0">yes</text>

    <text class="slot" x="50" y="286">hat, open</text>
    <text class="src" x="150" y="286">Freesound · CC BY 4.0</text>
    <rect class="credit" x="354" y="270" width="126" height="22" rx="11"/><text class="badge mono" x="417" y="285" text-anchor="middle" fill="#9be6f5">yes-with-credit</text>

    <text class="slot" x="50" y="326">808 <tspan class="why">in F</tspan></text>
    <text class="src" x="150" y="326">Freesound · CC0</text>
    <rect class="yes" x="384" y="310" width="96" height="22" rx="11"/><text class="badge mono" x="432" y="325" text-anchor="middle" fill="#a7f3d0">yes</text>
  </g>

  <path d="M510 190H548" stroke="#8a85a3" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- the files -->
  <rect x="560" y="30" width="370" height="320" rx="14" fill="#34d399" fill-opacity="0.05" stroke="#34d399" stroke-opacity="0.45"/>
  <text class="h" x="580" y="60">In your project</text>
  <text class="file mono" x="580" y="86" fill="#6ee7b7">samples/kits/dark-trap/</text>
  <path d="M590 96V326" stroke="#3d3855"/>
  <g>
    <path d="M590 116H604M590 156H604M590 196H604M590 236H604M590 276H604M590 316H604" stroke="#3d3855"/>
    <text class="file mono" x="612" y="121">6 × .wav</text>
    <text class="why" x="612" y="139">lossless original when the site has one</text>
    <text class="file mono" x="612" y="161">strudel.json</text>
    <text class="why" x="612" y="179">sample map: the kit plays in strudel.cc</text>
    <text class="file mono" x="612" y="201">kit.sfz</text>
    <text class="why" x="612" y="219">load it in any SFZ sampler</text>
    <text class="file mono" x="612" y="241">gm-map.json</text>
    <text class="why" x="612" y="259">General MIDI drum notes per slot</text>
    <text class="file mono" x="612" y="281">ATTRIBUTION.md</text>
    <text class="why" x="612" y="299">credits to paste in your release notes</text>
    <text class="file mono" x="612" y="321">credits.json</text>
    <text class="why" x="612" y="339">the same, for tools</text>
  </g>
</svg>
