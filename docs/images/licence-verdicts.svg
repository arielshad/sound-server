<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-labelledby="t d">
  <title id="t">Licence verdicts</title>
  <desc id="d">Every sound answers one question: can I put this in a commercial release? yes: no conditions (CC0, public domain, most royalty-free sites). yes-with-credit: credit the author (CC BY, OGA-BY). restricted: conditions that usually rule out a normal release (CC BY-SA, Sampling+). clearance-required: a real recording that needs a paid clearance (Tracklib). check-terms: unknown or unverified. no: non-commercial only (CC BY-NC, BBC RemArc). AI agents search commercial-safe sounds by default.</desc>
  <defs>
    <linearGradient id="scale" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.25" stop-color="#4cc9e6"/>
      <stop offset="0.5" stop-color="#f5b85b"/>
      <stop offset="0.7" stop-color="#fb923c"/>
      <stop offset="0.85" stop-color="#8a85a3"/>
      <stop offset="1" stop-color="#f87171"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .h { fill: #f0eef7; font-size: 16px; font-weight: 700; }
    .sub { fill: #a29eb6; font-size: 13px; }
    .v { font-size: 12px; font-weight: 700; }
    .m { fill: #e2dff0; font-size: 13px; }
    .ex { fill: #8a85a3; font-size: 12px; }
  </style>
  <rect width="960" height="300" rx="18" fill="#13111c"/>
  <rect x="0.5" y="0.5" width="959" height="299" rx="17.5" fill="none" stroke="#2a2638"/>

  <text class="h" x="30" y="40">Every sound answers one question: can I release a track with this?</text>
  <rect x="30" y="56" width="900" height="6" rx="3" fill="url(#scale)"/>
  <text class="sub" x="30" y="82">ship it</text>
  <text class="sub" x="930" y="82" text-anchor="end">keep it out of a release</text>

  <g>
    <rect x="30" y="96" width="140" height="150" rx="12" fill="#34d399" fill-opacity="0.07" stroke="#34d399" stroke-opacity="0.55"/>
    <text class="v mono" x="44" y="122" fill="#6ee7b7">yes</text>
    <text class="m" x="44" y="150">No conditions</text>
    <text class="ex" x="44" y="190">CC0, public domain,</text>
    <text class="ex" x="44" y="208">most royalty-free</text>
    <text class="ex" x="44" y="226">sites</text>

    <rect x="182" y="96" width="140" height="150" rx="12" fill="#4cc9e6" fill-opacity="0.07" stroke="#4cc9e6" stroke-opacity="0.55"/>
    <text class="v mono" x="196" y="122" fill="#7fdcf0">yes-with-credit</text>
    <text class="m" x="196" y="150">Credit the author</text>
    <text class="ex" x="196" y="190">CC BY, OGA-BY,</text>
    <text class="ex" x="196" y="208">Zapsplat free tier</text>

    <rect x="334" y="96" width="140" height="150" rx="12" fill="#f5b85b" fill-opacity="0.07" stroke="#f5b85b" stroke-opacity="0.55"/>
    <text class="v mono" x="348" y="122" fill="#fcd9a0">restricted</text>
    <text class="m" x="348" y="150">Conditions that</text>
    <text class="m" x="348" y="168">rule out a normal</text>
    <text class="m" x="348" y="186">release</text>
    <text class="ex" x="348" y="208">CC BY-SA,</text>
    <text class="ex" x="348" y="226">Sampling+</text>

    <rect x="486" y="96" width="140" height="150" rx="12" fill="#fb923c" fill-opacity="0.07" stroke="#fb923c" stroke-opacity="0.55"/>
    <text class="v mono" x="500" y="122" fill="#fdba74" style="font-size:10.5px" letter-spacing="-0.2">clearance-required</text>
    <text class="m" x="500" y="150">A real recording:</text>
    <text class="m" x="500" y="168">pay to clear it</text>
    <text class="ex" x="500" y="208">Tracklib</text>

    <rect x="638" y="96" width="140" height="150" rx="12" fill="#8a85a3" fill-opacity="0.08" stroke="#8a85a3" stroke-opacity="0.55"/>
    <text class="v mono" x="652" y="122" fill="#c9c5da">check-terms</text>
    <text class="m" x="652" y="150">Unknown or</text>
    <text class="m" x="652" y="168">unverified</text>
    <text class="ex" x="652" y="208">no licence stated,</text>
    <text class="ex" x="652" y="226">uploader-asserted</text>

    <rect x="790" y="96" width="140" height="150" rx="12" fill="#f87171" fill-opacity="0.07" stroke="#f87171" stroke-opacity="0.55"/>
    <text class="v mono" x="804" y="122" fill="#fca5a5">no</text>
    <text class="m" x="804" y="150">Non-commercial</text>
    <text class="m" x="804" y="168">only</text>
    <text class="ex" x="804" y="208">CC BY-NC, BY-ND,</text>
    <text class="ex" x="804" y="226">BBC RemArc</text>
  </g>

  <text class="sub" x="30" y="276">AI agents search <tspan fill="#6ee7b7">yes</tspan> and <tspan fill="#7fdcf0">yes-with-credit</tspan> by default. Downloads write ATTRIBUTION.md and credits.json. A summary, not legal advice.</text>
</svg>
