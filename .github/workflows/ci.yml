name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The daily source-discovery workflow pushes with GITHUB_TOKEN, which does
  # not trigger `push` runs, so it starts this workflow explicitly.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      # Audio analysis tests decode audio with ffmpeg/ffprobe.
      # A hung package mirror once stalled this step for half an hour: cap each
      # attempt and retry, rather than waiting out the 6-hour job limit.
      - name: ffmpeg
        timeout-minutes: 12
        run: |
          command -v ffprobe && exit 0
          for i in 1 2 3; do
            sudo timeout 180 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update &&
              sudo timeout 180 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends ffmpeg &&
              exit 0
            echo "apt attempt $i failed; retrying" && sleep 10
          done
          exit 1
      - run: npm ci
      - run: npm --prefix web ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test

  # On main: publish ghcr.io/arielshad/sound-server:{latest,sha-<commit>},
  # then pin that tag in deploy/kustomization.yaml. ArgoCD (registered in
  # shep-ai/shep-infra) syncs deploy/ from main, so the pin commit is the
  # rollout to sound.shep.bot. It's pushed with GITHUB_TOKEN, which doesn't
  # trigger another run.
  image:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Optional variant with the CLAP embedding runtime (onnxruntime needs glibc,
  # so it is the Debian-based `ml` stage): ghcr.io/arielshad/sound-server:{latest-ml,sha-<commit>-ml}.
  # Not pinned or deployed automatically; switch deploy/kustomization.yaml to
  # it when turning SOUND_SERVER_EMBEDDINGS on (see deploy/deployment.yaml).
  image-ml:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ml
          push: true
          tags: |
            ${{ env.IMAGE }}:latest-ml
            ${{ env.IMAGE }}:sha-${{ github.sha }}-ml
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=ml
          cache-to: type=gha,mode=max,scope=ml

  deploy:
    needs: image
    runs-on: ubuntu-latest
    concurrency: deploy
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50
      - name: Pin image tag
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA}"
          # A run that finished late must not roll back a newer deploy: if main
          # has commits after this one (other than pins), their run deploys.
          if git merge-base --is-ancestor "${GITHUB_SHA}" HEAD 2>/dev/null; then
            newer=$(git log --format=%s "${GITHUB_SHA}..HEAD" | grep -vc '^chore(deploy): pin image' || true)
            if [ "${newer}" -gt 0 ]; then echo "main has ${newer} newer commit(s); not pinning ${tag}"; exit 0; fi
          fi
          sed -i -E "s#^(\s*newTag:).*#\1 ${tag}#" deploy/kustomization.yaml
          if git diff --quiet; then echo "already pinned to ${tag}"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(deploy): pin image to ${tag}"
          for i in 1 2 3; do git push origin HEAD:main && exit 0; git pull --rebase origin main; done
          exit 1
