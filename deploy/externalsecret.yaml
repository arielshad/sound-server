# `sound-server-env` from Infisical (vault.shep.bot), through the live
# ClusterSecretStore "shep" (Infisical project "shep-app", env "prod",
# recursive from "/"). The "infisical" store this used to reference is defined
# in shep-infra but never applied on the cluster, so it could not sync at all.
#
# Add the value in Infisical (project shep-app, env prod) under the folder
# /sound-server:
#   FREESOUND_API_KEY   the "Client secret/Api key" from https://freesound.org/apiv2/apply
#
# Until it exists this ExternalSecret reports SecretSyncedError and the pod
# runs without Freesound (Openverse still covers part of its catalogue). Once
# it is there, ESO creates the Secret within refreshInterval and the mounted
# file updates in the running pod, so no restart is needed.
#
# Never add FREESOUND_OAUTH_TOKEN here: it is a personal token for local use.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sound-server-env
  namespace: sound-server
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: shep
  target:
    name: sound-server-env
    creationPolicy: Owner
  data:
    - secretKey: FREESOUND_API_KEY
      remoteRef:
        key: /sound-server/FREESOUND_API_KEY
