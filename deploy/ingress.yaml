# Ingress for sound.shep.bot. DNS is the *.shep.bot wildcard; TLS terminates at
# the edge Caddy, which issues the cert on demand because this Ingress declares
# the host (shep-infra: infra/edge-tls-ask) and forwards plain HTTP here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sound-server
  namespace: sound-server
  annotations:
    # /v1/assets/:id/download streams multi-file zips (textures + companions)
    # built on the fly — don't buffer them in nginx, and allow slow sources.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  ingressClassName: nginx
  rules:
    - host: sound.shep.bot
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sound-server
                port:
                  number: 80
