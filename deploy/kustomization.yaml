# Production manifests for sound.shep.bot, deployed by ArgoCD from this repo's
# main branch (registered in shep-ai/shep-infra: bootstrap/apps/92-sound-server.yaml,
# which also creates the `sound-server` namespace).
#
# CI (.github/workflows/ci.yml) builds ghcr.io/arielshad/sound-server on
# every push to main and commits the new sha tag to `newTag` below — that
# commit is the deploy.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sound-server
resources:
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - servicemonitor.yaml
  - externalsecret.yaml
images:
  - name: ghcr.io/arielshad/sound-server
    # Replaced by CI with the first image built from main.
    newTag: sha-42773cce0619e4e4785446ea42c6b85e8d1162d6
